# 隧道环境路径控制器参数配置
# 针对隧道环境优化的保守控制参数
# 增强版本：配合自定义隧道路径规划器使用

# 基础控制参数
lookahead_distance: 2.0          # 前瞻距离 (m) - 配合增强版规划器
waypoint_tolerance: 0.2          # 航点容差 (m) - 更精确的跟踪
max_velocity: 1.0                # 最大速度 (m/s) - 配合规划器速度
max_acceleration: 1.0            # 最大加速度 (m/s²) - 适度提高
max_jerk: 2.0                    # 最大加加速度 (m/s³)
control_frequency: 50.0          # 控制频率 (Hz)
fixed_height: 1.2                # 固定飞行高度 (m) - 隧道中线偏下

# 控制增益
yaw_gain: 1.0                    # 偏航角增益 - 配合规划器优化
position_gain: 1.0               # 位置增益 - 提高控制精度
velocity_gain: 0.6               # 速度增益 - 适度提高响应

# 安全参数
emergency_stop_timeout: 0.5      # 紧急停止超时 (s) - 更快的响应
max_path_age: 3.0                # 路径最大有效期 (s) - 更短的路径有效期

# 自适应前瞻距离
adaptive_lookahead: true         # 启用自适应前瞻距离
min_lookahead: 1.0               # 最小前瞻距离 (m) - 配合规划器
max_lookahead: 4.0               # 最大前瞻距离 (m) - 增加范围
velocity_lookahead_factor: 0.5   # 速度前瞻因子 - 适度提高

# 隧道环境特殊参数
tunnel_width_estimate: 2.0       # 隧道宽度估计 (m)
lateral_safety_margin: 0.3       # 横向安全边距 (m)
vertical_safety_margin: 0.2      # 垂直安全边距 (m)
enable_tunnel_centering: true    # 启用隧道中心化

# 路径平滑参数
smoothing_weight: 0.08           # 平滑权重 - 适度提高
smoothing_iterations: 25         # 平滑迭代次数 - 更多迭代
max_curvature: 0.6               # 最大曲率限制 - 适度放宽

# 安全监控参数
min_safe_distance: 0.5           # 最小安全距离 (m)
max_safe_distance: 3.0           # 最大安全距离 (m)
emergency_stop_distance: 0.3     # 紧急停止距离 (m)

# 高级隧道参数
enable_curvature_adaptive_smoothing: true  # 启用曲率自适应平滑
enable_tunnel_center_tracking: true        # 启用隧道中心跟踪
tunnel_center_tolerance: 0.2               # 隧道中心容差 (m)

# PID控制器参数 - 配合增强版规划器优化
# 位置PID (kp, ki, kd, integral_limit, output_limit)
x_pid: [1.0, 0.08, 0.15, 0.6, 1.8]
y_pid: [1.0, 0.08, 0.15, 0.6, 1.8]
z_pid: [1.0, 0.08, 0.15, 0.6, 1.8]

# 速度PID
vx_pid: [0.4, 0.02, 0.2, 0.4, 1.0]
vy_pid: [0.4, 0.02, 0.2, 0.4, 1.0]
vz_pid: [0.4, 0.02, 0.2, 0.4, 1.0]

# 偏航角PID
yaw_pid: [0.8, 0.02, 0.2, 0.4, 1.0]

# 误差阈值参数
error_threshold: 0.08            # PID积分误差阈值 - 更精确
derivative_limit: 2.5            # 微分项限幅 - 适度放宽

# ==================== 增强版规划器集成参数 ====================
# 这些参数用于与自定义隧道路径规划器配合使用
tunnel_planner_integration:
  enable_custom_planner: true     # 启用自定义规划器
  fallback_to_move_base: true     # 失败时回退到move_base
  planner_priority: "custom"       # 优先使用自定义规划器
  
  # 路径融合参数
  path_fusion_enabled: true       # 启用路径融合
  fusion_weight_custom: 0.7       # 自定义规划器权重
  fusion_weight_move_base: 0.3    # move_base权重
  
  # 控制器协调参数
  controller_coordination: true   # 启用控制器协调
  coordination_timeout: 2.0       # 协调超时时间
  enable_adaptive_control: true   # 启用自适应控制 