# Path Following Controller Parameters - 优化灵敏度和精度

path_following_controller:
  # Control parameters
  lookahead_distance: 1.5      # Distance to look ahead - 从2.0降低到1.5，提高响应性
  waypoint_tolerance: 0.3      # Tolerance for reaching waypoints - 从0.5降低到0.3，提高精度
  max_velocity: 3.0            # Maximum velocity - 从2.0增加到3.0，提高机动性
  max_acceleration: 2.0        # Maximum acceleration - 从1.0增加到2.0，提高响应性
  max_jerk: 3.0                # Maximum jerk - 从2.0增加到3.0，提高响应性
  control_frequency: 50.0      # Control loop frequency - 从30Hz提高到50Hz，提高控制精度
  fixed_height: 1.5            # Fixed flight height (meters)
  
  # Control gains - 优化控制增益
  yaw_gain: 1.5                # Yaw control gain - 从1.0增加到1.5，提高转向精度
  position_gain: 1.5           # Position control gain - 从1.0增加到1.5，提高位置精度
  velocity_gain: 0.8           # Velocity control gain - 从0.5增加到0.8，提高速度响应
  
  # Safety parameters
  emergency_stop_timeout: 1.0  # Emergency stop timeout (seconds)
  max_path_age: 5.0            # Maximum age of path before stopping (seconds)
  smoothing_factor: 0.1        # Trajectory smoothing factor (0-1)
  
  # Advanced parameters
  min_velocity: 0.1            # Minimum velocity (m/s)
  velocity_ramp_time: 1.0      # Time to ramp up/down velocity (seconds)
  yaw_rate_limit: 2.0          # Maximum yaw rate - 从1.0增加到2.0，提高转向能力
  
  # Path following parameters
  path_smoothing: true         # Enable path smoothing
  adaptive_lookahead: true     # Enable adaptive lookahead distance
  goal_tolerance: 0.1          # Final goal tolerance - 从0.2降低到0.1，提高到达精度 