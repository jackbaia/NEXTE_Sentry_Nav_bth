#机器人几何参，如果机器人是圆形，设置 robot_radius,如果是其他形状设置 footprint
robot_radius: 0.20 #圆形 (28cm对角线的一半约为20cm)
# footprint: [[-0.14, -0.14], [-0.14, 0.14], [0.14, 0.14], [0.14, -0.14]] #方形 28cm x 28cm
 
obstacle_range: 4.0 # 用于障碍物探测 - 从3.0增加到4.0，扩大检测范围
raytrace_range: 4.0 # 用于清除障碍物 - 从3.0增加到4.0，扩大清除范围
 
 
#膨胀半径，扩展在碰撞区域以外的代价区域，使得机器人规划路径避开障碍物
inflation_radius: 0.35        # 从0.25增加到0.35，增加安全距离
#代价比例系数，越大则代价值越小
cost_scaling_factor: 1.5      # 从2.0降低到1.5，提高避障敏感度
 
#地图类型
map_type: costmap
#导航包所需要的传感器
observation_sources: scan
#对传感器的坐标系和数据进行配置。这个也会用于代价地图添加和清除障碍物。例如，你可以用激光雷达传感器用于在代价地图添加障碍物，再添加kinect用于导航和清除障碍物。
#sensor_frame should be your own frame in tftree
scan: {sensor_frame: body_2d, data_type: LaserScan, topic: /scan, marking: true, clearing: true}