# TrajectoryPlannerROS:
 
# # Robot Configuration Parameters
#   max_vel_x: 0.5 # X 方向最大速度
#   min_vel_x: 0.1 # X 方向最小速速
#   max_vel_y: 0.5 # X 方向最小速速
#   min_vel_y: 0.1 # X 方向最小速速
 
#   max_vel_theta:  1.0 # 
#   min_vel_theta: -1.0
#   min_in_place_vel_theta: 1.0
 
#   acc_lim_x: 1.0 # X 加速限制
#   acc_lim_y: 1.0 # Y 加速限制
#   acc_lim_theta: 0.6 # 角速度加速限制
 
# # Goal Tolerance Parameters，目标公差
  # xy_goal_tolerance: 0.2 #default:0.1
  # yaw_goal_tolerance: 0.1 #default:0.05
 
# # Differential-drive robot configuration
# # 是否是全向移动机器人
#   holonomic_robot: true
 
# # Forward Simulation Parameters，前进模拟参数
#   sim_time: 2
#   vx_samples: 18
#   vx_samples: 10
#   vtheta_samples: 20
#   sim_granularity: 0.05


  # =================== segement ===============
base_local_planner: "dwa_local_planner/DWAPlannerROS"

controller_frequency: 25      # 从15Hz提高到25Hz，提高响应速度
# controller_patience:  15.0      # 15.0

DWAPlannerROS:
  odom_topic: Odometry
  holonomic_robot: true

  # Tolerances - 提高精度
  xy_goal_tolerance: 0.1      # 从0.2降低到0.1，提高到达精度
  yaw_goal_tolerance: 0.02    # 从0.05降低到0.02，提高角度精度
  latch_xy_goal_tolerance: true # 锁定目标容差

  # Forward simulation - 优化DWA参数提高灵敏度
  use_dwa: true                 # true
  sim_time: 1.8                 # 从1.5增加到1.8，提高前瞻性
  sim_granularity: 0.08         # 从0.1降低到0.08，提高精度
  angular_sim_granularity: 0.08 # 从0.1降低到0.08，提高角度精度
  vx_samples: 15                # 从10增加到15，提高路径质量
  vy_samples: 15                # 从10增加到15，提高路径质量
  vth_samples: 15               # 从10增加到15，提高路径质量

  # Scoring - 优化评分参数
  goal_distance_bias: 32        # 从24增加到32，更重视目标
  path_distance_bias: 24        # 新增，平衡路径平滑性
  occdist_scale: 0.02           # 新增，增加避障权重
  forward_point_distance: 0.325 # 新增，前向点距离

  # 动态避障参数
  max_vel_x: 2.0                # 从1.0增加到2.0，提高机动性
  min_vel_x: -2.0               # 从-1.0降低到-2.0，提高机动性
  max_vel_y: 2.0                # 从1.0增加到2.0，提高机动性
  min_vel_y: -2.0               # 从-1.0降低到-2.0，提高机动性
  max_rot_vel: 2.0              # 从1.0增加到2.0，提高转向能力
  min_rot_vel: 0.4              # 保持最小旋转速度

  # 加速度限制 - 更合理的设置
  acc_lim_x: 3.0                # 从10.0降低到3.0，更合理
  acc_lim_y: 3.0                # 从10.0降低到3.0，更合理
  acc_limit_trans: 3.0          # 从10降低到3.0

  # 其他参数
  oscillation_reset_dist: 0.1   # 0.05
  scaling_speed: 0.8            # 从0.7增加到0.8，提高速度利用率

  # 调试和可视化
  publish_traj_pc: true
  publish_cost_grid_pc: true
  global_frame_id: robot_foot_init